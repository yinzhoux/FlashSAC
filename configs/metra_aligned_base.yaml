##################################################################################
# METRA Aligned Base Config
#
# Aligns the training rhythm with the official METRA implementation:
#   Official command: --traj_batch_size 8 --max_path_length 200
#                     --trans_optimization_epochs 50 --n_parallel 1
#                     --trans_minibatch_size 256  (default)
#
# Usage:
#   python METRA_train.py --config-path configs --config-name metra_aligned_base \
#       env.env_name=Ant-v4
##################################################################################

project_name: 'Metra'
entity_name : 'draftrec'
group_name  : 'aligned'
exp_name    : 'test_aligned'
seed        : 0

logger_type     : 'tensorboard'
save_path       : 'models/${group_name}/${exp_name}/${env.env_name}/seed${seed}-TIMESTAMP'
agent_load_path : null
buffer_load_path: null

##################################################################################
# Environment
##################################################################################

num_train_envs : 1   # Match n_parallel=1 (sequential episode collection)
num_eval_envs  : 1
num_record_envs: 1

num_eval_episodes  : 1
num_record_episodes: 1

##################################################################################
# METRA-Aligned Training Rhythm (epoch-based, not step-based)
##################################################################################

n_epochs               : 1000   # total training epochs
traj_batch_size        : 8      # episodes collected per epoch  (--traj_batch_size 8)
max_path_length        : 200    # max steps per episode         (--max_path_length 200)
trans_optimization_epochs: 50   # gradient updates per epoch   (--trans_optimization_epochs 50)

# Approximate total env steps (if all episodes reach max_path_length)
num_env_steps: ${eval:'${n_epochs} * ${traj_batch_size} * ${max_path_length}'}

##################################################################################
# LR Scheduler compatibility
# The agent config uses ${num_interaction_steps} * ${updates_per_interaction_step}
# to compute warmup/decay steps.  Map this to total gradient steps:
#   total gradient steps = n_epochs * trans_optimization_epochs
##################################################################################

num_interaction_steps      : ${eval:'${n_epochs} * ${trans_optimization_epochs}'}
updates_per_interaction_step: 1.0
num_update_steps           : ${eval:'${num_interaction_steps} * ${updates_per_interaction_step}'}

##################################################################################
# Discount / n-step
##################################################################################

gamma : 0.99
n_step: 1

##################################################################################
# Per-epoch logging / evaluation / checkpoint cadence
##################################################################################

n_epochs_per_log   : 100   # log every 100 epochs  (= 160 000 env steps, matches official --n_epochs_per_log 100)
n_epochs_per_eval  : 1000  # eval every 1000 epochs (= 1.6 M env steps,   matches official --n_epochs_per_eval 1000)
n_epochs_per_record: 1000  # record video at same cadence as eval
n_epochs_per_save  : 1000  # checkpoint at end of 1000-epoch run
max_checkpoints_to_keep: 2

##################################################################################
# Defaults
##################################################################################

defaults:
  - agent: metra_aligned
  - env: mujoco
  - _self_
